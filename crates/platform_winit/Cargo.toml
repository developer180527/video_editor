[package]
name = "platform_winit"
description = "The UI shell: a window, input, clipboard and a wgpu surface for libgui, on desktop and iPadOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libgui.workspace = true
libgui_keymap.workspace = true
libgui_wgpu.workspace = true
libgui_winit.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
arboard.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-06 = { package = "objc2", version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSCell", "NSControl", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
