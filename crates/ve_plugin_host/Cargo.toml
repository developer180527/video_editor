[package]
name = "ve_plugin_host"
description = "Finds, loads and runs plugins: native ve ABI, OpenFX, CLAP, WASM add-ons, out-of-process add-ons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ve_model.workspace = true
ve_ports.workspace = true
ve_plugin_abi.workspace = true
thiserror.workspace = true
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

[dev-dependencies]
ve_builtins.workspace = true
platform_desktop.workspace = true
platform_headless.workspace = true
ve_media.workspace = true
ve_time.workspace = true
# Built for its .dylib/.so/.dll, which tests/clap_host.rs loads.
clap_test_gain = { path = "../clap_test_gain" }
